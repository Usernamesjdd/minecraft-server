<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سيرفرات ماين كرافت</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Tahoma, sans-serif; 
            background: linear-gradient(135deg, #1f1c2c, #928dab); 
            color: #fff; 
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* شريط الحساب والأزرار العلوي */
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            background: rgba(30, 30, 30, 0.8);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            font-size: 13px;
        }
        .top-bar button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* الصندوق الرئيسي */
        .box { 
            background: rgba(30, 30, 30, 0.9); 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 450px; 
            border: 2px solid #4CAF50;
            text-align: center;
        }
        h2 { color: #4CAF50; margin-bottom: 5px; font-size: 20px; }
        p { color: #bbb; font-size: 13px; }
        
        input { 
            padding: 12px; 
            width: 100%; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #555; 
            background: #2b2b2b;
            color: #fff;
            font-size: 15px; 
            outline: none;
        }
        input:focus { border-color: #4CAF50; }

            padding: 12px;
