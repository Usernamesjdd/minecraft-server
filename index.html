<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nex Messenger</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0033">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d001a; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* شاشة تسجيل الدخول */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d001a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 2000; }
        .messenger-logo { width: 75px; height: 75px; background: linear-gradient(135deg, #a64dff 0%, #6600cc 100%); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; box-shadow: 0 0 20px rgba(166, 77, 255, 0.4); }
        .auth-box { width: 100%; max-width: 360px; text-align: center; }
        .auth-box input { width: 100%; padding: 14px 18px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #4d0099; background: #1a0033; color: white; outline: none; font-size: 15px; text-align: right; }
        .auth-box input::placeholder { color: #8066b3; }
        .login-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #6600cc; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 5px; box-shadow: 0 4px 15px rgba(102, 0, 204, 0.4); }
        .login-btn:hover { background: #751aff; }
        .forgot-pass { display: block; margin-top: 15px; color: #b380ff; font-size: 13px; text-decoration: none; cursor: pointer; }
        .create-account-btn { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid #6600cc; background: transparent; color: #e6ccff; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 30px; }
        .developer-credit { margin-top: 25px; font-size: 12px; color: #b380ff; text-align: center; line-height: 1.5; }

        /* ================= الواجهة الرئيسية الجديدة والمميزة ================= */
        #mainHomeScreen { display: flex; flex-direction: column; height: 100vh; width: 100%; background: #0b0014; }
        
        .new-home-header { padding: 15px 20px; background: #120024; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d0059; }
        .new-home-title { font-size: 22px; font-weight: bold; color: #d9b3ff; letter-spacing: 0.5px; }
        .new-home-badge { background: #4d0099; padding: 5px 12px; border-radius: 15px; font-size: 12px; color: #e6ccff; border: 1px solid #751aff; }

        /* شريط بحث عصري */
        .new-search-area { padding: 12px 20px; background: #120024; }
        .new-search-box { display: flex; align-items: center; background: #1f003d; border-radius: 25px; padding: 8px 15px; border: 1px solid #5900b3; }
        .new-search-box input { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 14px; text-align: right; }
        .new-search-box input::placeholder { color: #9966ff; }

        /* قائمة الأصدقاء بتصميم بطاقات متطورة */
        .new-chats-container { flex: 1; overflow-y: auto; padding: 10px 15px; display: flex; flex-direction: column; gap: 10px; }
        .new-chat-card { display: flex; align-items: center; justify-content: space-between; background: #16002b; padding: 12px 15px; border-radius: 16px; border: 1px solid #330066; cursor: pointer; transition: 0.2s; }
        .new-chat-card:hover { background: #200040; border-color: #6600cc; transform: translateY(-1px); }
        
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #751aff, #4b0082); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; border: 2px solid #a64dff; box-shadow: 0 0 10px rgba(117,26,255,0.3); }
        .card-info { display: flex; flex-direction: column; gap: 4px; }
        .card-name { font-size: 16px; font-weight: bold; color: #ffffff; }
        .card-msg { font-size: 13px; color: #b380ff; }
        .card-status { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; }

        /* ================= شاشة المحادثة والكيبورد ================= */
        #chatScreen { display: none; flex-direction: column; height: 100vh; width: 100%; position: fixed; top: 0; left: 0; background: #0d001a; z-index: 100; }
        .chat-header { background: #15002b; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #330066; flex-shrink: 0; }
        .back-btn { background: none; border: none; color: #c980ff; font-size: 18px; cursor: pointer; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .message.received { background: #26004d; color: #f2e6ff; align-self: flex-start; border: 1px solid #4d0099; }
        .message.sent { background: #6600cc; color: #ffffff; align-self: flex-end; }
        
        .chat-input-area { background: #15002b; padding: 12px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #330066; flex-shrink: 0; }
        .chat-input-area input { flex: 1; background: #26004d; border: 1px solid #4d0099; border-radius: 20px; padding: 10px 15px; color: white; outline: none; font-size: 14px; text-align: right; }
        .send-btn { background: #6600cc; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 16px; flex-shrink: 0; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="authScreen">
        <div class="messenger-logo">💬</div>
        <div class="auth-box">
            <input type="text" id="emailInput" placeholder="رقم الهاتف أو البريد الإلكتروني">
            <input type="password" id="passInput" placeholder="كلمة السر">
            <button class="login-btn" onclick="loginUser()">تسجيل الدخول</button>
            <a class="forgot-pass">هل نسيت كلمة السر؟</a>
            <button class="create-account-btn" onclick="createAccountAlert()">إنشاء حساب جديد</button>
            <div class="developer-credit">صنع هذا التطبيق بيد مهدي الظالمي</div>
        </div>
    </div>

    <!-- الواجهة الرئيسية الجديدة والمختلفة -->
    <div id="mainHomeScreen" style="display: none;">
        <div class="new-home-header">
            <div class="new-home-title">Nex Chats</div>
            <div class="new-home-badge">متصل الآن</div>
        </div>

        <div class="new-search-area">
            <div class="new-search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن صديق في محادثاتك..." onkeyup="searchFriends()">
            </div>
        </div>

        <div class="new-chats-container" id="chatsList">
            <div class="new-chat-card" onclick="openChat('مهدي الظالمي')">
                <div class="card-left">
                    <div class="card-avatar">م</div>
                    <div class="card-info">
                        <div class="card-name">مهدي الظالمي</div>
                        <div class="card-msg">أهلاً بك في تطبيق Nex للمراسلة</div>
                    </div>
                </div>
                <div class="card-status"></div>
            </div>

            <div class="new-chat-card" onclick="openChat('حسين علي الحاجي')">
                <div class="card-left">
                    <div class="card-avatar" style="background: linear-gradient(135deg, #6600cc, #330066);">ح</div>
                    <div class="card-info">
                        <div class="card-name">حسين علي الحاجي</div>
                        <div class="card-msg">وينك شو ماكو؟</div>
                    </div>
                </div>
                <div class="card-status"></div>
            </div>

            <div class="new-chat-card" onclick="openChat('أبو فهد المعموري')">
                <div class="card-left">
                    <div class="card-avatar" style="background: linear-gradient(135deg, #5900b3, #26004d);">أ</div>
                    <div class="card-info">
                        <div class="card-name">أبو فهد المعموري</div>
                        <div class="card-msg">تمام حبيبي تسلم</div>
                    </div>
                </div>
                <div class="card-status"></div>
            </div>

            <div class="new-chat-card" onclick="openChat('Jdb Hdo')">
                <div class="card-left">
                    <div class="card-avatar" style="background: linear-gradient(135deg, #8000ff, #4d0099);">J</div>
                    <div class="card-info">
                        <div class="card-name">Jdb Hdo</div>
                        <div class="card-msg">مرحبا صديقي</div>
                    </div>
                </div>
                <div class="card-status"></div>
            </div>
        </div>
    </div>

    <!-- نافذة المحادثة -->
    <div id="chatScreen">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="back-btn" onclick="closeChat()">⬅</button>
                <div class="card-avatar" id="activeChatAvatar" style="width: 36px; height: 36px; font-size: 14px;">م</div>
                <span id="activeChatName" style="font-weight: bold; color: #e6ccff; font-size: 16px;">اسم الصديق</span>
            </div>
            <div style="display: flex; gap: 15px; color: #c980ff; font-size: 18px;">
                <span>📞</span>
                <span>📹</span>
            </div>
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message received">أهلاً بك، تم فتح المحادثة بنجاح!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        let currentFriend = "";

        function loginUser() {
            let email = document.getElementById('emailInput').value;
            let pass = document.getElementById('passInput').value;
            if(email.trim() !== "" && pass.trim() !== "") {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainHomeScreen').style.display = 'flex';
            } else {
                alert('يرجى إدخال البريد أو رقم الهاتف وكلمة السر');
            }
        }

        function createAccountAlert() {
            let newAcc = prompt("أدخل بريدك أو رقم هاتفك لإنشاء حساب جديد:");
            if(newAcc) {
                alert("تم إنشاء الحساب بنجاح! سجل دخول الآن.");
            }
        }

        function openChat(name) {
            currentFriend = name;
            document.getElementById('activeChatName').textContent = name;
            document.getElementById('activeChatAvatar').textContent = name.charAt(0);
            document.getElementById('mainHomeScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
        }

        function closeChat() {
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('mainHomeScreen').style.display = 'flex';
        }

        function searchFriends() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.new-chat-card');
            cards.forEach(card => {
                let name = card.querySelector('.card-name').textContent.toLowerCase();
                if(name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function sendMsg() {
            let input = document.getElementById('msgInput');
            let chatBox = document.getElementById('chatBox');
            if(input.value.trim() !== "") {
                let userMsg = document.createElement('div');
                userMsg.className = 'message sent';
                userMsg.textContent = input.value;
                chatBox.appendChild(userMsg);
                
                let textVal = input.value;
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;

                setTimeout(() => {
                    let replyMsg = document.createElement('div');
                    replyMsg.className = 'message received';
                    replyMsg.textContent = "رد " + currentFriend + ": أهلاً وسهلاً!";
                    chatBox.appendChild(replyMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') {
                sendMsg();
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
