<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAXOR CRAFT - Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #060814;
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            padding-bottom: 95px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        
        /* شاشة تسجيل الدخول */
        #login-section {
            background: linear-gradient(135deg, #0d1124, #121829);
            border: 2px solid #2563eb;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.3);
            text-align: center;
            margin-top: 40px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #60a5fa;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .creator-badge {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-box {
            position: relative;
            margin-bottom: 15px;
        }
        .input-field {
            width: 100%;
            background: #030712;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 45px 14px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: right;
        }
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        /* لوحة التحكم الرئيسية */
        #dashboard { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* رأس الصفحة المطابق للصورة تماماً */
        .header-banner {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #10b981;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .copy-icon-box {
            background: #1f2937;
            border: 2px solid #8b5cf6;
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c084fc;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }
        .server-title-area {
            flex-grow: 1;
            text-align: center;
        }
        .server-title {
            font-size: 19px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .server-ready-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        /* شبكة الأزرار الأربعة العليا */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .dashboard-btn {
            border-radius: 16px;
            padding: 16px 15px;
            color: #fff;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dashboard-btn.purple {
            background: linear-gradient(135deg, #3b0764, #581c87);
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .dashboard-btn.blue {
            background: linear-gradient(135deg, #1e3a8a, #172554);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .dashboard-btn.orange {
            background: linear-gradient(135deg, #78350f, #451a03);
            border: 2px solid #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }
        .dashboard-btn.green {
            background: linear-gradient(135deg, #064e3b, #022c22);
            border: 2px solid #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        .btn-icon-box {
            font-size: 22px;
            background: rgba(255,255,255,0.08);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-card {
            background: linear-gradient(135deg, #0f172
