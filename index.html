<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Server - Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            padding-bottom: 90px;
        }
        .admin-badge {
            background: rgba(255, 68, 68, 0.1);
            color: #ff5555;
            text-align: center;
            padding: 6px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid rgba(255, 68, 68, 0.3);
            max-width: 250px;
            margin: 0 auto 15px auto;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .server-header {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .server-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .server-code {
            font-size: 11px;
            color: #8b949e;
        }
        
        /* تصميم حقول الإدخال */
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
        }
        .input-field {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #58a6ff;
        }

        /* شريط حالة السيرفر وزر التشغيل */
        .status-offline {
            background: #da3633;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-online {
            background: #238636;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .start-btn {
            background: #2ea043;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.4);
            transition: background 0.2s;
        }
        .start-btn:hover {
            background: #238636;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .menu-btn {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            transition: all 0.2s;
            width: 100%;
        }
        .menu-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .menu-btn span {
            font-size: 16px;
        }
        .btn-full {
            grid-column: span 2;
        }
        .btn-warning {
            border-color: rgba(210, 153, 34, 0.4);
        }
        
        #dashboard { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: none;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }
        .nav-item.active {
            color: #58a6ff;
        }
        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="admin-badge">Owner: مهدي الظالمي</div>

    <div class="container">
        <!-- واجهة تسجيل الدخول بنظام الحقول المدمجة -->
        <div id="login-section" class="card">
            <h2 style="color: #58a6ff; margin-bottom: 8px; font-size: 20px; text-align: center;">Friends Server</h2>
            <p style="color: #8b949e; font-size: 13px; margin-bottom: 20px; text-align: center;">تسجيل الدخول للوصول إلى لوحة التحكم</p>
            
            <div class="input-group">
                <label>البريد الإلكتروني (Email)</label>
                <input type="email" id="emailInput" class="input-field" placeholder="name@example.com">
            </div>

            <button class="menu-btn" style="background: #1f6feb; justify-content: center; width: 100%; margin-top: 5px;" onclick="handleLogin()">
                <span>📧</span> إرسال رمز التحقق
            </button>
        </div>

        <!-- لوحة التحكم الرئيسية -->
        <div id="dashboard">
            
            <!-- قسم السيرفر -->
            <div id="tab-server" class="tab-content active">
                <div class="card">
                    <!-- معلومات السيرفر -->
                    <div class="server-header">
                        <div style="text-align: right;">
                            <div class="server-name">Ahabha</div>
                            <div class="server-code">#It4t1NO6RwOSihNz</div>
                        </div>
                        <div style="font-size: 20px;">🌍</div>
                    </div>

                    <!-- شريط حالة السيرفر -->
                    <div id="serverStatus" class="status-offline">
                        <span>●</span> غير متصل (Offline)
                    </div>

                    <!-- زر التشغيل الكبير -->
                    <button class="start-btn" onclick="toggleServer()">
                        <span>⏻</span> <span id="startBtnText">بدء تشغيل (Start)</span>
                    </button>

                    <!-- باقي أزرار القائمة -->
                    <div class="grid-menu">
                        <button class="menu-btn" onclick="alert('السيرفر (Server)');"><span>⚡</span> السيرفر</button>
                        <button class="menu-btn" onclick="alert('الاعدادات (Settings)');"><span>⚙️</span> الاعدادات</button>
                        
                        <button class="menu-btn" onclick="alert('وحدة التحكم (Console)');"><span>>_</span> وحدة التحكم</button>
                        <button class="menu-btn" onclick="alert('سجل (Logs)');"><span>📄</span> سجل</button>
                        
                        <button class="menu-btn" onclick="alert('اللاعبون (Players)');"><span>👥</span> اللاعبون</button>
                        <button class="menu-btn" onclick="alert('النظام (Software)');"><span>🔧</span> النظام</button>
                        
                        <button class="menu-btn" onclick="alert('الملفات (Files)');"><span>📁</span> الملفات</button>
                        <button class="menu-btn" onclick="alert('العوالم (Worlds)');"><span>🌍</span> العوالم</button>
                        
                        <button class="menu-btn btn-full btn-warning" onclick="alert('نسخة احتياطية (Backup)');"><span>⚠️</span> نسخة احتياطية</button>
                        <button class="menu-btn btn-full" onclick="alert('الوصول (Access)');"><span>👤</span> الوصول</button>
                    </div>
                </div>
            </div>

            <!-- قسم الحساب -->
            <div id="tab-account" class="tab-content">
                <div class="card" style="text-align: center;">
                    <h2 style="color: #58a6ff; margin-bottom: 10px; font-size: 18px;">إعدادات الحساب</h2>
                    <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;">تم تسجيل الدخول بنجاح</p>
                    <button class="menu-btn" style="justify-content: center; width: 100%; margin-bottom: 10px;" onclick="alert('تغيير البريد');">تغيير البريد الإلكتروني</button>
                    <button class="menu-btn" style="justify-content: center; width: 100%; background: #da3633;" onclick="location.reload();">تسجيل الخروج</button>
                </div>
            </div>

            <!-- قسم المساعدة -->
            <div id="tab-help" class="tab-content">
                <div class="card" style="text-align: center;">
                    <h2 style="color: #58a6ff; margin-bottom: 10px; font-size: 18px;">المساعدة والدعم</h2>
                    <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;">تحتاج إلى مساعدة في إدارة السيرفر؟</p>
                    <button class="menu-btn" style="justify-content: center; width: 100%;" onclick="alert('الاتصال بالمالك: مهدي الظالمي');">تواصل مع المالك (مهدي الظالمي)</button>
                </div>
            </div>

        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" onclick="switchTab('help', this)">
            <div class="nav-icon">❓</div>مساعدة
        </button>
        <button class="nav-item active" onclick="switchTab('server', this)">
            <div class="nav-icon">⚡</div>السيرفر
        </button>
        <button class="nav-item" onclick="switchTab('account', this)">
            <div class="nav-icon">👤</div>الحساب
        </button>
    </div>

    <script>
        let isRunning = false;

        function handleLogin() {
            let email = document.getElementById('emailInput').value;
            if(!email || !email.includes('@')) {
                alert('الرجاء إدخال بريد إلكتروني صحيح!');
                return;
            }

            let code = Math.floor(1000 + Math.random() * 9000);
            alert('تم إرسال رمز التحقق إلى ' + email + '\n(رمز التجربة الوهمي: ' + code + ')');
            
            let userCode = prompt('أدخل رمز التحقق المكون من 4 أرقام:');
            if(userCode == code) {
                alert('تم تسجيل الدخول بنجاح! أهلاً بك');
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
            } else if(userCode) {
                alert('رمز التحقق غير صحيح!');
            }
        }

        function toggleServer() {
            let statusDiv = document.getElementById('serverStatus');
            let btnText = document.getElementById('startBtnText');
            
            if(!isRunning) {
                alert('جاري تشغيل السيرفر... (Starting Server)');
                isRunning = true;
                statusDiv.className = 'status-online';
                statusDiv.innerHTML = '<span>●</span> متصل (Online)';
                btnText.innerText = 'إيقاف السيرفر (Stop)';
                document.querySelector('.start-btn').style.background = '#da3633';
            } else {
                alert('جاري إيقاف السيرفر... (Stopping Server)');
                isRunning = false;
                statusDiv.className = 'status-offline';
                statusDiv.innerHTML = '<span>●</span> غير متصل (Offline)';
                btnText.innerText = 'بدء تشغيل (Start)';
                document.querySelector('.start-btn').style.background = '#2ea043';
            }
        }

        function switchTab(tabName, element) {
            let tabs = document.getElementsByClassName('tab-content');
            for (let t of tabs) { t.classList.remove('active'); }
            let items = document.getElementsByClassName('nav-item');
            for (let i of items) { i.classList.remove('active'); }
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }
    </script>

</body>
</html>
