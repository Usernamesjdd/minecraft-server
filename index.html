<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيرفرات وعوالم ماين كرافت</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #1e1e1e;
            color: #84CAF5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #8ff980;
        }
        .server-box {
            background: #333;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        .ip {
            background: #111;
            color: #82196F;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>عالم ماين كرافت</h1>
        <p>اختار السيرفر أو العالم ويا جماعتك بسهولة</p>
        
        <div class="server-box">
            <h3>عوالِم البقاء</h3>
            <p>سيرفر سرفايفل ممتع وبدون لاغ</p>
            <div class="ip">play.example.com</div>
        </div>
    </div>

</body>
</html>
