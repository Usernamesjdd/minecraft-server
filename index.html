<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Server - Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #090d16;
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            padding-bottom: 90px;
        }
        .container {
            max-width: 420px;
            margin: 30px auto;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        
        /* الدائرة المتحركة في الأعلى */
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .creator-text {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* حقول الإدخال */
        .input-box {
            position: relative;
            margin-bottom: 15px;
        }
        .input-field {
            width: 100%;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 14px 15px 14px 45px;
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: right;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #60a5fa;
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
        }

        /* الأزرار */
        .btn-custom {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-login {
            background: transparent;
            color: #60a5fa;
            border: 1px solid #3b82f6;
        }
        .btn-login:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        .btn-register {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
        }
        .btn-register:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        /* تصميم صفحة السيرفر المطابقة لصورتك */
        .server-header {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .server-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .server-code {
            font-size: 11px;
            color: #8b949e;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #da3633;
            border-radius: 50%;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .menu-btn {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .menu-btn span {
            font-size: 16px;
        }
        .btn-full {
            grid-column: span 2;
        }
        .btn-warning {
            border-color: rgba(210, 153, 34, 0.4);
        }

        #dashboard { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: none;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }
        .nav-item.active {
            color: #58a6ff;
        }
        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- واجهة تسجيل الدخول -->
        <div id="login-section" class="card">
            <div class="loader"></div>
            <div class="creator-text">تم إنشاء هذا الموقع من قبل مهدي الظالمي</div>
            
            <div class="input-box">
                <input type="email" id="emailInput" class="input-field" placeholder="البريد الإلكتروني">
                <span class="input-icon">📧</span>
            </div>

            <div class="input-box">
                <input type="password" id="passInput" class="input-field" placeholder="كلمة المرور">
                <span class="input-icon">🔒</span>
            </div>

            <button class="btn-custom btn-login" onclick="handleLogin()">تسجيل الدخول</button>
            <button class="btn-custom btn-register" onclick="alert('فتح صفحة إنشاء حساب جديد')">إنشاء حساب جديد</button>
        </div>

        <!-- لوحة التحكم الرئيسية (تظهر بعد تسجيل الدخول) -->
        <div id="dashboard">
            
            <!-- قسم السيرفر (مطابق لصورتك تماماً) -->
            <div id="tab-server" class="tab-content active">
                <div class="card" style="text-align: right; padding: 20px;">
                    <div style="font-size: 15px; font-weight: bold; margin-bottom: 15px; color: #8b949e; text-align: right;">السيرفر</div>
                    
                    <div class="server-header">
                        <div class="status-dot"></div>
                        <div style="text-align: right;">
                            <div class="server-name">Ahabha</div>
                            <div class="server-code">#It4t1NO6RwOSihNz</div>
                        </div>
                    </div>

                    <div class="grid-menu">
                        <button class="menu-btn" onclick="alert('السيرفر (Server)');"><span>⚡</span> السيرفر</button>
                        <button class="menu-btn" onclick="alert('الاعدادات (Settings)');"><span>⚙️</span> الاعدادات</button>
                        
                        <button class="menu-btn" onclick="alert('وحدة التحكم (Console)');"><span>>_</span> وحدة التحكم</button>
                        <button class="menu-btn" onclick="alert('سجل (Logs)');"><span>📄</span> سجل</button>
                        
                        <button class="menu-btn" onclick="alert('اللاعبون (Players)');"><span>👥</span> اللاعبون</button>
                        <button class="menu-btn" onclick="alert('النظام (Software)');"><span>🔧</span> النظام</button>
                        
                        <button class="menu-btn" onclick="alert('الملفات (Files)');"><span>📁</span> الملفات</button>
                        <button class="menu-btn" onclick="alert('العوالم (Worlds)');"><span>🌍</span> العوالم</button>
                        
                        <button class="menu-btn btn-full btn-warning" onclick="alert('نسخة احتياطية (Backup)');"><span>⚠️</span> نسخة احتياطية</button>
                        <button class="menu-btn btn-full" onclick="alert('الوصول (Access)');"><span>👤</span> الوصول</button>
                    </div>
                </div>
            </div>

            <!-- قسم الحساب -->
            <div id="tab-account" class="tab-content">
                <div class="card" style="text-align: center;">
                    <h2 style="color: #58a6ff; margin-bottom: 10px; font-size: 18px;">إعدادات الحساب</h2>
                    <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;">تم تسجيل الدخول بنجاح</p>
                    <button class="menu-btn" style="justify-content: center; width: 100%; margin-bottom: 10px;" onclick="alert('تغيير البريد');">تغيير البريد الإلكتروني</button>
                    <button class="menu-btn" style="justify-content: center; width: 100%; background: #da3633;" onclick="location.reload();">تسجيل الخروج</button>
                </div>
            </div>

            <!-- قسم المساعدة -->
            <div id="tab-help" class="tab-content">
                <div class="card" style="text-align: center;">
                    <h2 style="color: #58a6ff; margin-bottom: 10px; font-size: 18px;">المساعدة والدعم</h2>
                    <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;">تحتاج إلى مساعدة في إدارة السيرفر؟</p>
                    <button class="menu-btn" style="justify-content: center; width: 100%;" onclick="alert('الاتصال بالمالك: مهدي الظالمي');">تواصل مع المالك (مهدي الظالمي)</button>
                </div>
            </div>

        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" onclick="switchTab('help', this)">
            <div class="nav-icon">❓</div>مساعدة
        </button>
        <button class="nav-item active" onclick="switchTab('server', this)">
            <div class="nav-icon">⚡</div>السيرفر
        </button>
        <button class="nav-item" onclick="switchTab('account', this)">
            <div class="nav-icon">👤</div>الحساب
        </button>
    </div>

    <script>
        function handleLogin() {
            let email = document.getElementById('emailInput').value;
            let pass = document.getElementById('passInput').value;

            if(!email || !email.includes('@')) {
                alert('الرجاء إدخال بريد إلكتروني صحيح!');
                return;
            }
            if(!pass) {
                alert('الرجاء إدخال كلمة المرور!');
                return;
            }

            alert('تم تسجيل الدخول بنجاح!');
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
        }

        function switchTab(tabName, element) {
            let tabs = document.getElementsByClassName('tab-content');
            for (let t of tabs) { t.classList.remove('active'); }
            let items = document.getElementsByClassName('nav-item');
            for (let i of items) { i.classList.remove('active'); }
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }
    </script>

</body>
</html>
