<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Server</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .admin {
            color: #ff4444;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .box {
            background: #1a1a1a;
            max-width: 400px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .status {
            color: #238636;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .ip-box {
            background: #111;
            color: #ffeb3b;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px dashed #444;
            cursor: pointer;
        }
        .btn {
            background: #21262d;
            color: #fff;
            border: 1px solid #30363d;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .btn:hover { background: #30363d; }
        .btn-green { background: #238636; border: none; }
        .btn-green:hover { background: #2ea043; }
        .btn-red { background: #da3633; border: none; }
        .btn-red:hover { background: #f85149; }
    </style>
</head>
<body>

    <div class="admin">Owner: مهدي الظالمي</div>

    <div class="box">
        <h1>Friends Server</h1>
        <div class="status">● Server Online</div>

        <div class="ip-box" onclick="navigator.clipboard.writeText('play.friendsserver.com'); alert('IP Copied!');">
            play.friendsserver.com
        </div>

        <button class="btn btn-green" onclick="alert('Starting Server...');">Start Server</button>
        <button class="btn btn-red" onclick="alert('Stopping Server...');">Stop Server</button>
        <button class="btn" onclick="alert('Settings Opened!');">Server Settings</button>
        <button class="btn" onclick="alert('Mods Menu Opened!');">Mods Management</button>
    </div>

</body>
</html>
